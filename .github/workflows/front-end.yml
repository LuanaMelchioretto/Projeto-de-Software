name: Front-end CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'front-end/**'
      - '.github/workflows/front-end.yml'
  push:
    branches: [main]
    paths:
      - 'front-end/**'
      - '.github/workflows/front-end.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: front-end-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Obter o código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar o build
        run: npm run build
